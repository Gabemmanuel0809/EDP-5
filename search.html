<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — NTP</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <a href="dashboard.html" class="topbar-back" aria-label="Back to dashboard">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="dashboard.html" class="topbar-logo" aria-label="NTP Home">NTP</a>
    <nav class="topbar-nav">
      <a href="./">📝 Tasks</a>
      <a href="search.html" aria-current="page">🔍 Search</a>
      <a href="calendar.html">📅 Calendar</a>
      <a href="achievements.html">🏆 Achievements</a>
    </nav>
  </div>
  <div class="player">
    <strong id="player-level"></strong>
    <progress id="xp-progress" max="100" value="0"></progress>
    <span id="xp-text"></span>
  </div>
</header>
<div id="alert-banner" role="alert" hidden></div>

<main class="page">

  <section class="panel">
    <h2>Search Tasks</h2>
    <div class="filters">
      <input id="search-input" type="search" placeholder="Search by title…">
      <select id="priority-filter">
        <option value="all">All priorities</option>
        <option value="high">🔴 Important</option>
        <option value="medium">🟡 Moderate</option>
        <option value="low">🟢 Slight</option>
      </select>
      <select id="status-filter">
        <option value="all">All statuses</option>
        <option value="pending">⏳ Pending</option>
        <option value="done">✅ Completed</option>
      </select>
    </div>
    <ul id="task-list"></ul>
  </section>

</main>

<div id="toast-area" aria-live="polite"></div>

<dialog id="delete-confirm-dialog" aria-labelledby="delete-dialog-title">
  <p id="delete-dialog-title">Sure you want to remove this task?</p>
  <div class="dialog-buttons">
    <button id="delete-confirm-yes" class="primary">Yes, remove</button>
    <button id="delete-confirm-no">Cancel</button>
  </div>
</dialog>

<script type="module" src="js/search.js"></script>
</body>
</html>
